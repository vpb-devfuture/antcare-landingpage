# ==============================================================================
# ANTCARE - Cấu hình Nginx hoàn chỉnh (Redirect 301, Static Prerender & HTTP 404)
# Vị trí chèn: bên trong block 'server { ... }' của domain antcare.vn trên máy chủ Ubuntu
# ==============================================================================

# ------------------------------------------------------------------------------
# 1. REDIRECT 301 (Bao gồm cả biến thể có dấu '/' và không có '/' ở cuối)
