# ==============================================================================
# ANTCARE - Cấu hình Nginx hoàn chỉnh (Redirect 301, Static Prerender & HTTP 404)
# Vị trí chèn: bên trong block 'server { ... }' của domain antcare.vn trên máy chủ Ubuntu
# ==============================================================================

# ------------------------------------------------------------------------------
# 1. REDIRECT 301 (Bao gồm cả biến thể có dấu '/' và không có '/' ở cuối)
# ------------------------------------------------------------------------------

# Nhóm 1: Chuẩn bị khi đi khám -> gộp về bài checklist chuẩn (ID 129)
location ~ ^/news/chuan-bi-gi-khi-dua-bo-me-di-kham-benh/?$ {
    return 301 https://antcare.vn/news/checklist-dua-bo-me-di-kham-benh-vien;
}

location ~ ^/news/dua-bo-me-di-kham-benh-ha-noi-can-chuan-bi-gi/?$ {
    return 301 https://antcare.vn/news/checklist-dua-bo-me-di-kham-benh-vien;
}

# Nhóm 2: Giới thiệu dịch vụ -> chuyển về trang dịch vụ mới
location ~ ^/news/dich-vu-dong-hanh-kham-benh-la-gi/?$ {
    return 301 https://antcare.vn/dich-vu/dua-nguoi-cao-tuoi-di-kham-ha-noi;
}

location ~ ^/news/dich-vu-dong-hanh-di-kham-benh-cho-nguoi-gia/?$ {
    return 301 https://antcare.vn/dich-vu/dua-nguoi-cao-tuoi-di-kham-ha-noi;
}

# ------------------------------------------------------------------------------
# 2. CẤU HÌNH TRANG LỖI 404 THÂN THIỆN
# ------------------------------------------------------------------------------
error_page 404 /404.html;

location = /404.html {
    internal;
}

# ------------------------------------------------------------------------------
# 3. ROUTE PREFIX FALLBACK CHO CÁC ROUTE ĐỘNG (NẾU CÓ)
# ------------------------------------------------------------------------------
# Với các prefix có thể phát sinh trang động ở client-side trong tương lai:
# Nginx sẽ ưu tiên file HTML tĩnh đã prerender ($uri/index.html),
# nếu chưa có file tĩnh thì fallback về /index.html để React Router điều hướng,
# tránh bị lỗi 404 khi người dùng truy cập trực tiếp.
location /san-pham/ {
    try_files $uri $uri/index.html /index.html;
}

location /tai-khoan/ {
    try_files $uri $uri/index.html /index.html;
}

# ------------------------------------------------------------------------------
# 4. CẤU HÌNH TOÀN SITE (PRERENDER HTML TĨNH & HTTP 404 THẬT CHUẨN SEO)
# ------------------------------------------------------------------------------
# Toàn bộ site (trang chủ, static pages, 133 bài viết news, 6 bài activities...)
# đã được prerender thành file tĩnh ($uri/index.html).
# Bất kỳ URL nào không tồn tại thực tế sẽ trả mã HTTP 404 thật và hiển thị 404.html.
location / {
    try_files $uri $uri/index.html =404;
}
